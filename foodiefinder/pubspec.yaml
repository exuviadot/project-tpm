name: foodiefinder
description: Aplikasi rekomendasi kuliner Yogyakarta
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Auth & Security
  flutter_secure_storage: ^9.2.1
  local_auth: ^2.2.0
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.3.5

  # Local Storage (Caching)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Sensors
  sensors_plus: ^5.0.0

  # Notifications
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.2

  # URL Launcher
  url_launcher: ^6.2.6

  # Image
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/restaurants.json